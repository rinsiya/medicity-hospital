<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - MediCity</title>

    <link rel="stylesheet" href="/static/css/styles.css">
        <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .error {
            color: #fff;
            font-size: 12px;
            height: 20px;
            padding: 5px;
        }
    </style>
</head>

<body>

    <div class="page">  

        <header class="header">  
            <div class="logo">
                <span class="plus">+</span>
                <span class="medi">Medi</span><span class="city">City</span>
            </div>
        </header>

        <main class="main">

            <section class="content-area">

                <div class="card phone-card">

                    <h1>Reset New password</h1>

                    <p class="subtitle">
                        Enter your new password below. We will update your account
                        with this new password to ensure your account security.
                </p>
{{ if .error }}
    <p class="error-message">{{ .error }}</p>
{{ end }}
{{ if .message }}
    <p class="success-message">{{ .message }}</p>
{{ end }}

            <form class="form" action="/{{.role}}/change-forgot-password" method="POST" onsubmit="return validatePassword()">

          

                    <label for="newPassword">
                        NEW PASSWORD
                    </label>

                    <div class="phone-input">

                        <i class="fa-solid fa-lock lock-icon"></i>

                        <input type="password" id="newPassword" name="password" placeholder="••••••••"
                            autocomplete="new-password">
<i class="fa-regular fa-eye toggle-password" id="newPasswordEye"
                            onclick="togglePassword('newPassword', 'newPasswordEye')">
                        </i>
                      

                    </div>

                    <div id="newPasswordError" class="field-error"></div>

            


                <!-- Confirm Password -->
                    <label for="confirmPassword">
                        CONFIRM PASSWORD
                    </label>

                    <div class="phone-input">

                        <i class="fa-solid fa-lock lock-icon"></i>

                        <input type="password" id="confirmPassword" name="confirm_password" placeholder="••••••••"
                            autocomplete="new-password">
 <i class="fa-regular fa-eye toggle-password" id="confirmPasswordEye"
                            onclick="togglePassword('confirmPassword', 'confirmPasswordEye')">
                        </i>

                    </div>

                    <div id="confirmPasswordError" class="field-error"></div>

                <!-- Update button -->
              <button class="primary-btn" type="submit">


                    Update

                    <span>→</span>

                </button>

            </form>


            <!-- Back to login -->
                            <a class="back-link" href="/{{.role}}/login">

                ← Back to Login
            </a>
</div>
</section>
    </main>


    <!-- Footer -->
    <footer class="footer">

        © 2026 MediCity Hospital. All Rights Reserved.

    </footer>

    </div>


    <script>

        // Show / hide password
        function togglePassword(inputId, eyeId) {

            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);

            if (input.type === "password") {

                input.type = "text";

                eye.classList.remove("fa-eye");
                eye.classList.add("fa-eye-slash");

            } else {

                input.type = "password";

                eye.classList.remove("fa-eye-slash");
                eye.classList.add("fa-eye");

            }
        }


        // Form validation
        function validatePassword() {

            const newPassword =
                document.getElementById("newPassword").value.trim();

            const confirmPassword =
                document.getElementById("confirmPassword").value.trim();

            const newPasswordError =
                document.getElementById("newPasswordError");

            const confirmPasswordError =
                document.getElementById("confirmPasswordError");


            newPasswordError.textContent = "";
            confirmPasswordError.textContent = "";


            let valid = true;


            if (newPassword === "") {

                newPasswordError.textContent =
                    "New password is required.";

                valid = false;

            } else if (newPassword.length < 8) {

                newPasswordError.textContent =
                    "Password must contain at least 8 characters.";

                valid = false;
            }


            if (confirmPassword === "") {

                confirmPasswordError.textContent =
                    "Please confirm your password.";

                valid = false;

            } else if (newPassword !== confirmPassword) {

                confirmPasswordError.textContent =
                    "Passwords do not match.";

                valid = false;
            }


            return valid;
        }

    </script>

</body>

</html>
