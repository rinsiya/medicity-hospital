<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Phone Number - MediCity</title>

    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>

    <div class="page">

        <header class="header">
            <div class="logo">
                <span class="plus">+</span>
                <span class="medi">Medi</span><span class="city">City</span>
            </div>
        </header>

        <main class="main">

            <section class="content-area">

                <div class="card phone-card">

                    <h1>Enter your Phone Number</h1>

                    <p class="subtitle">
                        Enter your mobile number below. We will send a verification code
                        to this number to ensure your account security. you can change password after verify phone
                        number successfully
                    </p>

                    <p id="serverError"></p>

                    <form class="form" action="/{{.role}}/auth/forgot-password" method="post" id="submitPhone">

                        <label for="Phone">PHONE NUMBER</label>

                        <div class="phone-input">

                            <span class="flag">🌐</span>

                            <span class="country-code">+</span>

                            <input id="Phone" name="Phone" type="tel" placeholder="Enter your phone number"
                                maxlength="16" inputmode="tel" autocomplete="tel" required>

                        </div>
                        <button class="primary-btn" type="submit">
                            Send Verification Code &nbsp;➜
                        </button>

                    </form>

                    <a class="back-link" href="/{{.role}}/login">
                        ← Back to Login
                    </a>

                </div>

            </section>

        </main>

        <footer class="footer">
            © 2026 MediCity Hospital. All Rights Reserved.
        </footer>

    </div>


    <script>

        serverError.textContent = "";
        const role = "{{.role}}";
        function validatePhone() {

            const phoneInput = document.getElementById("Phone");
            //  const error = document.getElementById("phoneError");

            const phone = phoneInput.value.trim();
            const serverError = document.getElementById("serverError");

            if (phone === "") {
                serverError.textContent = "Please enter your phone number.";
                phoneInput.focus();
                return false;
            }

            const phonePattern = /^\+?[1-9]\d{6,14}$/;

            if (!phonePattern.test(phone)) {

                serverError.textContent =
                    "Please enter a valid international phone number.";

                phoneInput.focus();

                return false;
            }

            return true;
        }
        /*
         * Allow only:
         * numbers
         * +
         * spaces
         * -
         * (
         * )
         *
         * while typing.
         */
        document
            .getElementById("Phone")
            .addEventListener("input", function () {

                this.value = this.value.replace(
                    /[^0-9+()\-\s]/g,
                    ""
                );



                serverError.textContent = "";
            });
        document.getElementById("submitPhone").addEventListener("submit", async function (event) {
            //alert("ok")

            event.preventDefault();

            const form = this;
            const formData = new FormData(form);

            try {
                const response = await fetch(`/${role}/auth/forgot-password`, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    serverError.textContent = data.message || "Something went wrong.";
                    return;
                }
                //  alert("ok" + data.redirect)
                window.location.href = data.redirect;
            } catch (error) {

                console.error("Profile update error:", error);

                //alert("Something went wrong. Please try again.");
            }
        });

    </script>

</body>

</html>
