<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediCity - Change Password</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .error {
            color: #fff;
            font-size: 12px;
            height: 20px;
            padding: 5px;
        }
    </style>
    ```

</head>

<body>

    ```
    <header>

        <div class="top-bar">
            <a href="/patient/signup">
                <button class="signup-btn">Sign Up</button>
            </a>
        </div>

        <div class="logo-bar">
            <h1>
                <span class="green">+</span>
                <span class="green">Medi</span><span class="blue">City</span>
            </h1>
        </div>

    </header>


    <!-- Main Content -->
    <main>
        <div class="login-card">
        <div class="centre-panel">

            <h1>Change Your Password</h1>

            <p class="subtitle">
                Enter your new password below.
            </p>


            <!-- Error / Success message -->
            {{if .error}}
            <div class="error-message">
                {{.error}}
            </div>
            {{end}}

            {{if .message}}
            <div class="success-message">
                {{.message}}
            </div>
            {{end}}


            <form action="/{{.role}}/change-password" method="POST" onsubmit="return validatePassword()">

                <!-- New Password -->
                <div class="form-group">

                    <label for="newPassword">
                        NEW PASSWORD
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock lock-icon"></i>

                        <input type="password" id="newPassword" name="new_password" placeholder="••••••••"
                            autocomplete="new-password">

                        <i class="fa-regular fa-eye toggle-password" id="newPasswordEye"
                            onclick="togglePassword('newPassword', 'newPasswordEye')">
                        </i>

                    </div>

                    <div id="newPasswordError" class="field-error"></div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        CONFIRM PASSWORD
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock lock-icon"></i>

                        <input type="password" id="confirmPassword" name="confirm_password" placeholder="••••••••"
                            autocomplete="new-password">

                        <i class="fa-regular fa-eye toggle-password" id="confirmPasswordEye"
                            onclick="togglePassword('confirmPassword', 'confirmPasswordEye')">
                        </i>

                    </div>

                    <div id="confirmPasswordError" class="field-error"></div>

                </div>


                <!-- Update button -->
                <button type="submit" class="login-btn">

                    Update

                    <span>→</span>

                </button>

            </form>


            <!-- Back to login -->
            <a href="/patient/login" class="back-login">
                ← Back to Login
            </a>
</div>
        </div>
    </main>


    <!-- Footer -->
    <footer class="footer">

        © 2026 MediCity Hospital. All Rights Reserved.

    </footer>

    </div>


    <script>

        // Show / hide password
        function togglePassword(inputId, eyeId) {

            const input = document.getElementById(inputId);
            const eye = document.getElementById(eyeId);

            if (input.type === "password") {

                input.type = "text";

                eye.classList.remove("fa-eye");
                eye.classList.add("fa-eye-slash");

            } else {

                input.type = "password";

                eye.classList.remove("fa-eye-slash");
                eye.classList.add("fa-eye");

            }
        }


        // Form validation
        function validatePassword() {

            const newPassword =
                document.getElementById("newPassword").value.trim();

            const confirmPassword =
                document.getElementById("confirmPassword").value.trim();

            const newPasswordError =
                document.getElementById("newPasswordError");

            const confirmPasswordError =
                document.getElementById("confirmPasswordError");


            newPasswordError.textContent = "";
            confirmPasswordError.textContent = "";


            let valid = true;


            if (newPassword === "") {

                newPasswordError.textContent =
                    "New password is required.";

                valid = false;

            } else if (newPassword.length < 8) {

                newPasswordError.textContent =
                    "Password must contain at least 8 characters.";

                valid = false;
            }


            if (confirmPassword === "") {

                confirmPasswordError.textContent =
                    "Please confirm your password.";

                valid = false;

            } else if (newPassword !== confirmPassword) {

                confirmPasswordError.textContent =
                    "Passwords do not match.";

                valid = false;
            }


            return valid;
        }

    </script>

</body>

</html>
