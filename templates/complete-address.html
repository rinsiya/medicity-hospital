<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCity - Patient Dashboard</title>
    <link rel="stylesheet" href="/static/css/patientHome.css">
    <style>
        .main-content {
            flex: 1;
            position: relative;
            padding-top: 7px;
        }

        .breadcrumb {
            width: 692px;
            max-width: calc(100% - 30px);
            margin: 0 auto 8px;
            font-size: 8px;
            color: #252525;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .breadcrumb a {
            color: #333;
            text-decoration: none;
        }

        .breadcrumb strong {
            font-weight: 600;
        }



        .profile-card {
            width: 337px;
            min-height: 506px;
            margin: 0 auto;
            border: 1px solid #d7ddd9;
            border-radius: 7px 7px 0 0;
            box-shadow: 0 1px 7px rgba(0, 0, 0, 0.03);
            padding: 23px 24px 23px;
            background: #fff;
        }

        .profile-icon {
            position: relative;
            width: 36px;
            height: 36px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #a6f3b6;
            color: #087126;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .profile-icon span {
            position: absolute;
            font-size: 9px;
            right: 5px;
            top: 6px;
        }

        .profile-card h1 {
            text-align: center;
            color: #004b1e;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #707070;
            font-size: 10px;
            line-height: 14px;
            margin-bottom: 23px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group>label {
            display: block;
            font-size: 9px;
            color: #313b36;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="date"],
        input[type="file"] {
            width: 100%;
            height: 30px;
            border: 1px solid #cfd6d2;
            background: #f3f5f5;
            border-radius: 5px;
            padding: 0 10px;
            color: #333;
            font-size: 9px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #555;
        }

        input:focus {
            border-color: #087126;
            box-shadow: 0 0 0 2px rgba(8, 113, 38, 0.08);
        }

        input[type="date"] {
            color: #555;
            font-family: Arial, Helvetica, sans-serif;
        }

        input[type="file"] {
            padding: 0;
            cursor: pointer;
        }

        input[type="file"]::-webkit-file-upload-button {
            height: 28px;
            border: 0;
            background: transparent;
            padding-left: 10px;
            color: #555;
            font-size: 9px;
            cursor: pointer;
        }

        /* Gender buttons */

        .gender-options {
            display: flex;
            gap: 7px;
        }

        .gender-option {
            flex: 1;
            position: relative;
            cursor: pointer;
        }

        .gender-option input {
            position: absolute;
            opacity: 0;
        }

        .gender-option span {
            height: 34px;
            border: 1px solid #cfd6d2;
            border-radius: 5px;
            background: #f5f6f6;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #39403d;
            font-size: 9px;
        }

        .gender-option input:checked+span {
            border-color: #087126;
            background: #e8f8ec;
            color: #005a25;
        }

        /* Continue button */

        .continue-btn {
            width: 100%;
            height: 33px;
            margin-top: 11px;
            border: 0;
            border-radius: 5px;
            background: #006525;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
        }

        .continue-btn span {
            font-size: 17px;
            vertical-align: -1px;
            margin-left: 3px;
        }

        .continue-btn:hover {
            background: #00531e;
        }

    

        footer {
            height: 78px;
            background: #0b034f;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
        }


        @media (max-width: 760px) {
            .top-header {
                padding: 0 12px;
            }

            .top-right {
                gap: 14px;
            }

            .top-right>a {
                display: none;
            }

            .navbar {
                padding: 0 20px;
            }

            .logo {
                font-size: 27px;
            }

            .logo-cross {
                font-size: 43px;
            }

            .nav-links {
                gap: 18px;
                margin-right: 0;
            }

            .nav-links a {
                font-size: 11px;
                line-height: 13px;
            }

            .nav-links .call-us {
                display: none;
            }

            .profile-card {
                width: calc(100% - 30px);
                max-width: 337px;
            }

            footer {
                font-size: 12px;
                text-align: center;
                padding: 0 10px;
            }
        }

        @media (max-width: 420px) {
            .patient-info {
                display: none;
            }

            .navbar {
                height: 62px;
            }

            .nav-links a:first-child {
                display: none;
            }

            .profile-card {
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>

    <header class="top-header">
        <div class="utility-bar">
            <a href="#">Feedback</a>
            <a href="#">Search</a>
            <button class="sign-out">Sign out</button>
        </div>

        <div class="main-nav">
            <a class="brand" href="#">
                <span class="brand-plus">+</span><span>Medi</span><b>City</b>
            </a>

            <nav>
                <a href="#">Our<br>Specialities</a>
                <a href="#">Book<br>Appointment</a>
                <a href="#" class="call-us">Call Us <span class="phone">●</span></a>
            </nav>
        </div>
    </header>

    <main class="page">

        <div class="breadcrumb">
            <a href="#">Home</a>
            <span>›</span>
            <strong>Add address details</strong>
        </div>

        <section class="profile-card">
            <div class="profile-icon">♙<span>✓</span></div>

            <h1>Complete Your Profile</h1>

            <p class="description">
                To ensure proper service, please provide<br>
                your address details.
            </p>

            <form id="profileForm" method="POST" action="/patient/complete-address" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="address">Address</label>
                    <div class="input-wrapper">
                        <input type="text" id="address" name="address" placeholder="Enter address" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="place">Place</label>
                    <input type="text" id="place" name="place" placeholder="Enter place here">
                </div>
                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" name="country" placeholder="Enter country here">
                </div>

         
                <button type="submit" class="continue-btn">
                    Save and Continue <span>→</span>
                </button>

            </form>
        </section>


    </main>

    <footer>
        © 2026 MediCity Hospital. All Rights Reserved.
    </footer>

    <script>
        document.getElementById("profileForm").addEventListener("submit", async function (event) {

            event.preventDefault();

            const form = this;
            const formData = new FormData(form);

            try {

                const response = await fetch("/patient/complete-address", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    alert(data.message || "Failed to add address.");
                    return;
                }

                // Redirect to the URL returned by the backend
                window.location.href = data.redirect;

            } catch (error) {

                console.error("Profile update error:", error);

                alert("Something went wrong. Please try again.");
            }
        });
    </script>

</body>

</html>
